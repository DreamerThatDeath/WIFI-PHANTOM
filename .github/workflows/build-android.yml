name: Build and publish WIFI PHANTOM APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WIFI-PHANTOM-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view wifi-phantom-latest >/dev/null 2>&1; then
            gh release upload wifi-phantom-latest "$APK#WIFI-PHANTOM.apk" --clobber
          else
            gh release create wifi-phantom-latest "$APK#WIFI-PHANTOM.apk" --title "WIFI PHANTOM latest APK" --notes "Latest automatically built WIFI PHANTOM Android APK. Android will require you to approve Wi-Fi connection requests."
          fi
